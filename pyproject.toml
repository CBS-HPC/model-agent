[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbs-model-agent"
version = "0.1.3"
description = "Provider selection and inference workflows for CBS open-weight models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE.md", "LICENSES/*.txt"]
dependencies = []

[project.optional-dependencies]
aitta = ["lumi-aitta-api @ git+https://github.com/CBS-HPC/lumi-aitta-api.git@v0.1.0"]
ucloud-vllm = ["ucloud-vllm-agent[ucloud] @ git+https://github.com/CBS-HPC/ucloud-vllm-agent.git@v0.1.5"]
providers = [
  "lumi-aitta-api @ git+https://github.com/CBS-HPC/lumi-aitta-api.git@v0.1.0",
  "ucloud-vllm-agent[ucloud] @ git+https://github.com/CBS-HPC/ucloud-vllm-agent.git@v0.1.5",
]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
cbs-model = "cbs_model_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
